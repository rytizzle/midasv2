bundle:
  name: midasv2

variables:
  lakebase_instance:
    description: >-
      Name of the Lakebase (managed Postgres) instance this app provisions and
      uses for the approval-workflow store. One source of truth: it names both
      the provisioned resource and the runtime LAKEBASE_INSTANCE_NAME env var.
    default: midasv2-lakebase

sync:
  include:
    - .deploy/**

resources:
  database_instances:
    lakebase:
      name: ${var.lakebase_instance}
      capacity: CU_1

  apps:
    app:
      name: "midasv2"
      description: "Midas v2 - AI Metadata Generator for Unity Catalog (AppKit rebuild)"
      source_code_path: ./.deploy

      config:
        env:
          # Runtime must target the same instance the bundle provisions, so
          # OAuth DB credential generation hits the right Lakebase instance.
          - name: LAKEBASE_INSTANCE_NAME
            value: ${var.lakebase_instance}

      user_api_scopes:
        - sql
        - dashboards.genie
        - serving.serving-endpoints
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read

      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: databricks-gpt-5-4
            permission: CAN_QUERY
        - name: lakebase-db
          description: "Lakebase Postgres database for approval session storage"
          database:
            instance_name: ${resources.database_instances.lakebase.name}
            database_name: app_db
            permission: CAN_CONNECT_AND_CREATE

targets:
  # Internal Midas dev workspace (unchanged default).
  default:
    default: true
    workspace:
      host: https://fevm-midas.cloud.databricks.com

  # Customer deploy. The workspace host is NOT set here: the Databricks CLI
  # forbids variable interpolation on workspace.host (it configures auth), so
  # the host comes from the CLI profile (-p) or the DATABRICKS_HOST env var.
  # The Lakebase instance name is entered at deploy time via --var.
  #
  #   databricks bundle deploy -t customer -p <customer-profile> \
  #     --var="lakebase_instance=<instance-name>"
  #
  # or, without a profile:
  #   export DATABRICKS_HOST=https://<customer>.cloud.databricks.com
  #   export DATABRICKS_TOKEN=<token>
  #   databricks bundle deploy -t customer --var="lakebase_instance=<instance-name>"
  customer:
    mode: production
